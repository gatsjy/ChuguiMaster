[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chugui-master"
version = "2.1.0"
description = "축의금 스마트 취합 & 감사 메시지 생성기"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<7.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pyinstaller>=6.0"]

[project.gui-scripts]
chugui-master = "chugui.app:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # 한글 문자열의 전각 기호 오탐
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Qt 관용구: 시그널 이름은 camelCase가 규약이고,
# 모델 오버라이드의 기본 인자 QModelIndex()는 Qt API 시그니처를 그대로 따른 것이다.
"src/chugui/ui/*" = ["N815", "B008"]
